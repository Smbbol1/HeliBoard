name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clonar modelo Vosk en español
        uses: actions/checkout@v4
        with:
          repository: kercre123/vosk-models
          path: temp-models

      - name: Preparar modelo Vosk en assets
        run: |
          mkdir -p app/src/main/assets/model-es
          unzip -q temp-models/vosk-model-small-es-0.42.zip
          mv vosk-model-small-es-0.42/* app/src/main/assets/model-es/
          rm -rf vosk-model-small-es-0.42 temp-models
          python3 -c 'p="app/src/main/AndroidManifest.xml"; d="schemas."+"android.com"; s=open(p).read().replace("http://android.com\"",f"http://{d}/apk/res/android\"").replace("http://android.com\">",f"http://{d}/tools\">"); open(p,"w").write(s)'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-debug
          path: app/build/outputs/apk/debug/*-debug*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
